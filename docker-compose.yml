###############################################################################
# InfoExplorer Agent — Docker Stack
#
# Add new agents by:
#   1. Creating agents/<agent-name>/ with Dockerfile + agent.py + config.yaml
#   2. Adding a new service block below following the same pattern
#   3. Attaching it to the "agentic-platform" network
###############################################################################

networks:
  agentic-platform:
    name: agentic-platform
    driver: bridge

services:

  # ── SearXNG — Bundled Search Engine ─────────────────────────────────────────
  # Internal only — not exposed outside the stack
  searxng:
    image: searxng/searxng:latest
    container_name: research-searxng
    restart: unless-stopped
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    networks:
      - agentic-platform
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/search?format=json&q=test"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── InfoExplorer Agent ──────────────────────────────────────────────────────────
  # Automated web research & local AI synthesis — configure topics in config.yaml
  # Dashboard at: http://localhost:8888
  infoexplorer-agent:
    build:
      context: ./agents/explorer
      dockerfile: Dockerfile
    container_name: agent-infoexplorer
    restart: unless-stopped
    ports:
      - "${RESEARCH_PORT:-8888}:8888"
    volumes:
      - ${REPORTS_DIR:-./reports}:/reports
      - ./agents/explorer/config.yaml:/app/config.yaml   # writable — model changes persist
      - ./explorations:/app/explorations                 # writable — schedule/skill edits persist
    environment:
      - TZ=${TZ:-UTC}
      - SEARXNG_URL=http://research-searxng:8080
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - CONFIG_PATH=/app/config.yaml
      - EXPLORATIONS_DIR=/app/explorations
      - PORT=8888
      - RUN_ON_START=${RUN_ON_START:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agentic-platform
    depends_on:
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

