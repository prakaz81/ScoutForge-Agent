id: default
title: "WorldNews"        # ≤15 chars — used in report filenames
description: "Daily digest of world affairs, geopolitics, technology, business, and science. A general-purpose research monitor ready to use out of the box."

schedule:
  frequency: "daily"      # daily | weekly | monthly
  hour: 7
  minute: 0
  timezone: "UTC"
  day_of_week: "mon"      # used when frequency = weekly
  day: 1                  # used when frequency = monthly

research:
  time_range: ""           # SearXNG time filter: day | week | month | "" (no filter)
  max_age_months: 3
  dedup_against_last_n_reports: 2

  topics:
    - area: "Geopolitics & World Affairs"
      queries:
        - "major geopolitical developments today"
        - "international relations conflict diplomacy news"
        - "UN NATO G7 G20 summit statement announcement"
        - "trade war sanctions economic policy news"
        - "election result political change news"
        - "war conflict ceasefire peace deal news"
        - "humanitarian crisis refugee news"
        - "global security threat intelligence news"

    - area: "Technology & Innovation"
      queries:
        - "technology breakthrough innovation announcement"
        - "tech startup funding IPO acquisition news"
        - "artificial intelligence major announcement release"
        - "semiconductor chip supply chain news"
        - "quantum computing breakthrough research"
        - "space exploration mission launch news"
        - "robotics automation industry news"
        - "big tech company product launch announcement"

    - area: "Business & Economy"
      queries:
        - "global economy GDP growth recession forecast"
        - "central bank interest rate decision inflation"
        - "stock market major move crash rally news"
        - "major company earnings results layoffs news"
        - "supply chain disruption commodity price news"
        - "merger acquisition deal announcement"
        - "cryptocurrency bitcoin market news"
        - "energy oil gas price news"

    - area: "Science & Environment"
      queries:
        - "climate change environmental policy announcement"
        - "scientific research discovery breakthrough"
        - "natural disaster extreme weather event news"
        - "renewable energy solar wind nuclear news"
        - "pandemic disease outbreak health alert"
        - "biodiversity conservation species news"
        - "ocean atmosphere earth science news"

    - area: "Society & Policy"
      queries:
        - "social movement protest activism news"
        - "education policy reform announcement"
        - "healthcare medical policy announcement"
        - "immigration policy border news"
        - "human rights ruling court decision news"
        - "cybersecurity breach data incident news"
        - "media censorship free speech news"
