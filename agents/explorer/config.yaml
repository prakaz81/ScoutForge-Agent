# ── InfoExplorer Agent — Global Engine Config ─────────────────────────────────
# This file controls the shared research engine settings (Ollama, fetching, report format).
# Per-exploration settings (title, schedule, topics) live in explorations/{id}/config.yaml

ollama:
  model: "llama3.1:8b"
  num_predict: 4000
  temperature: 0.3

research:
  max_results_per_query: 2
  fetch_article_content: true
  max_article_chars: 2000

report:
  output_dir: "/reports"        # base dir; per-exploration reports go into /reports/{expl_id}/
  executive_summary_points: 6
  key_insights_points: 6
  watch_list_points: 4
  format: "markdown"
